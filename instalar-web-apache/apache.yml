---
- name: Provisionar servidor web Apache (Avançado)
  hosts: webservers
  become: true

  tasks:
    - name: Instalar o pacote httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Iniciar e habilitar o serviço httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Gerar pagina HTML dinamica a partir do template
      ansible.builtin.template:
        src: index.html.j2 #local que vai pegar o template 
        dest: /var/www/html/index.html #local onde vai despachar no servidor remoto (VM)
        owner: apache
        group: apache
        mode: '0644'
      notify: Reiniciar Apache   

    - name: Liberar porta HTTP no firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
      ignore_errors: true
      
  handlers:
    - name: Reiniciar Apache
      ansible.builtin.service:
        name: httpd
        state: restarted