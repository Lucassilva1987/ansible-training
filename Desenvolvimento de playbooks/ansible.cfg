
[defaults]

# Define o arquivo de inventário utilizado pelo Ansible.
inventory = inventory

# Define o usuário utilizado para conectar aos servidores remotos via SSH.
remote_user = devops

# Não solicita interativamente a senha SSH durante a conexão.
ask_pass = false


[privilege_escalation]

# Habilita a elevação de privilégios durante a execução das tarefas.
become = true

# Define o método utilizado para elevar os privilégios (sudo).
become_method = ansible.builtin.sudo

# Define o usuário que executará as tarefas após a elevação.
become_user = root

# Não solicita interativamente a senha do sudo.
become_ask_pass = false
